name: Deploy WAP Static Site to Pages

on:
  push:
    branches: ["main"] # Hoặc "master" tùy tên branch chính của bạn
    paths-ignore:
      - '**.md'
      - '.gitignore'

# Cấp quyền cho GitHub Actions deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Tránh việc 2 lượt push liên tiếp đè lên nhau
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Chỉ clone đúng commit mới nhất (Không tải toàn bộ lịch sử Git)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Khởi tạo môi trường GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. Đóng gói các file tĩnh (HTML, CSS, JS, JSON)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Deploy toàn bộ thư mục gốc

      # 4. Deploy trực tiếp lên GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
